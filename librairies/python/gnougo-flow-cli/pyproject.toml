[project]
name = "gnougo-flow-cli"
version = "0.1.0"
description = "Authored YAML demonstration runner and schema-9 durable Flow run CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "GnOuGo" },
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "gnougo-flow-core>=0.1.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44.0",
  "pydantic>=2.13.5",
  "PyYAML>=6.0.3",
  "rich>=15.0.0",
  "typer>=0.27.2",
  "openai>=3.18.0",
  "axa-fr-app-settings>=0.4.4",
  "mcp>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.8",
]

[project.scripts]
gnougo-flow-cli = "gnougo_flow_cli.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.uv.sources]
gnougo-flow-core = { path = "../gnougo-flow-core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

