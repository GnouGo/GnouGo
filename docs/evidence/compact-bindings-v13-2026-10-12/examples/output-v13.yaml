version: 1
name: "outputs"
entrypoint: "main"
workflows:
  main:
    inputs:
      label:
        type: "string"
        required: true
      authorized:
        type: "boolean"
        required: true
    steps: []
    outputs:
      chosen:
        type: "string"
        expr: |-
          ${
          (() => {
            const label = data.inputs.label;
            const requiredCondition = data.inputs.authorized;
            return label;
          })()
          }
        expression_contracts:
          '':
            label:
              origin: "first"
              schema: {type: "string", minLength: 1}
              order: 0
              source: "label"
              instance_path: "/value"
            requiredCondition:
              origin: "guard"
              schema: {type: "boolean", enum: [true]}
              order: 1
              source: "requiredCondition"
              instance_path: "/value"
            chosen:
              origin: "assembly"
              schema: {type: "string"}
              order: 2
              source: "label"
              instance_path: "/chosen"
            chosen_2:
              origin: "export"
              schema: {type: "string"}
              order: 3
              source: "label"
              instance_path: "/chosen"
skill:
  description: ""
  inputs:
    label:
      type: "string"
      required: true
    authorized:
      type: "boolean"
      required: true
  outputs:
    chosen:
      type: "string"
      expr: |-
        ${
        (() => {
          const label = data.inputs.label;
          const requiredCondition = data.inputs.authorized;
          return label;
        })()
        }
      expression_contracts:
        '':
          label:
            origin: "first"
            schema: {type: "string", minLength: 1}
            order: 0
            source: "label"
            instance_path: "/value"
          requiredCondition:
            origin: "guard"
            schema: {type: "boolean", enum: [true]}
            order: 1
            source: "requiredCondition"
            instance_path: "/value"
          chosen:
            origin: "assembly"
            schema: {type: "string"}
            order: 2
            source: "label"
            instance_path: "/chosen"
          chosen_2:
            origin: "export"
            schema: {type: "string"}
            order: 3
            source: "label"
            instance_path: "/chosen"
...
