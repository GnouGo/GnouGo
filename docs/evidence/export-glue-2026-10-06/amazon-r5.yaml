      input:
        value: "${(data.steps.n_1d0aa97802d59b73.outputs.complete === true)}"
      output_schema:
        type: "object"
        properties:
          value:
            type: "boolean"
            enum:
            - true
        required:
        - "value"
        additionalProperties: false
