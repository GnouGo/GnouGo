version: 1
name: "readable"
entrypoint: "main"
workflows:
  main:
    inputs:
      searchPages:
        type: "array"
        items:
          type: "array"
          items:
            type: "number"
            nullable: true
        required: true
    steps:
    - id: "n_bfa062de040f55a1"
      type: "set"
      input: |-
        ${
        (() => {
          const checkedValue = {
            value: data.inputs.searchPages
          };
          const products = ((binding_input_value) => ({
            products: (binding_input_value).flatMap((item) => item)
          }))(checkedValue.value);
          return {
            products
          };
        })()
        }
      output_schema:
        type: "object"
        properties:
          products:
            type: "object"
            properties:
              products:
                type: "array"
                items:
                  type:
                  - "number"
                  - "null"
            required:
            - "products"
            additionalProperties: false
        required:
        - "products"
        additionalProperties: false
      description: "Check and assemble consecutive deterministic values."
      expression_contracts:
        '':
          checkedValue:
            origin: "pages"
            schema:
              type: "object"
              properties:
                value:
                  type: "array"
                  items:
                    type: "array"
                    items:
                      type:
                      - "number"
                      - "null"
              required:
              - "value"
              additionalProperties: false
          products:
            origin: "products"
            schema:
              type: "object"
              properties:
                products:
                  type: "array"
                  items:
                    type:
                    - "number"
                    - "null"
              required:
              - "products"
              additionalProperties: false
    outputs:
      products:
        type: "array"
        items:
          type: "number"
          nullable: true
        expr: "${data.steps.n_bfa062de040f55a1.products.products}"
skill:
  description: ""
  inputs:
    searchPages:
      type: "array"
      items:
        type: "array"
        items:
          type: "number"
          nullable: true
      required: true
  outputs:
    products:
      type: "array"
      items:
        type: "number"
        nullable: true
      expr: "${data.steps.n_bfa062de040f55a1.products.products}"
