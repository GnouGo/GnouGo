      input:
        prompt: "${data.steps.n_18ee0a0e0ef8ecba.text}"
        structured_output:
          schema_inline:
            type: "object"
            properties:
              url:
                type: "string"
            required:
            - "url"
            additionalProperties: false
          strict: true
