      type: "mcp.call"
      description: "Écrire le classeur Excel demandé au chemin fixe avec le TSV préparé, en écrasant le fichier existant si nécessaire."
      input:
        request:
          filePath: "workflows/schema-portability-20261002/indexprojection20261008a-amazon-1/products.xlsx"
