          Instruction:
          {{{instruction}}}
          Business data (JSON):
          {{{values}}}
        data:
          instruction: "Assembler le TSV du classeur Excel avec tous les produits visités, dans l’ordre conservé, en normalisant tabulations et retours ligne; inclure explicitement les données absentes, prix absents, CAPTCHA ou blocages."
          values:
            query: "${data.inputs.query}"
            selection: "${data.steps.n_d27638e2da78cad5.json}"
            visitedProducts: "${data.steps.n_aae41fbbd2873504.outputs.productRow}"
    - id: "n_c3f13ecd706ea14d"
      type: "llm.call"
      description: "Assembler le TSV du classeur Excel avec tous les produits visités, dans l’ordre conservé, en normalisant tabulations et retours ligne; inclure explicitement les données absentes, prix absents, CAPTCHA ou blocages."
      input:
        prompt: "${data.steps.n_4d45e41227cb6d4e.text}"
        structured_output:
          schema_inline:
            type: "object"
            properties:
