version: 1
name: "outputs"
entrypoint: "main"
workflows:
  main:
    inputs:
      observationPages:
        type: "array"
        items:
          type: "array"
          items:
            type: "object"
            properties:
              key:
                type: "string"
              text:
                type: "string"
                nullable: true
            required_properties:
            - "key"
            - "text"
        required: true
      selectedKeys:
        type: "array"
        items:
          type: "string"
        required: true
    steps: []
    outputs:
      products:
        type: "array"
        items:
          type: "object"
          properties:
            key:
              type: "string"
            text:
              type: "string"
              nullable: true
          required_properties:
          - "key"
          - "text"
        expr: |-
          ${
          m.lookup((data.inputs.observationPages).flatMap(item => item), data.inputs.selectedKeys, "key")
          }
        expression_contracts:
          '': {}
