version: 1
name: "outputs"
entrypoint: "main"
workflows:
  main:
    inputs:
      observationPages:
        type: "array"
        items:
          type: "array"
          items:
            type: "object"
            properties:
              key:
                type: "string"
              text:
                type: "string"
                nullable: true
            required_properties:
            - "key"
            - "text"
        required: true
      selectedKeys:
        type: "array"
        items:
          type: "string"
        required: true
    steps: []
    outputs:
      products:
        type: "array"
        items:
          type: "object"
          properties:
            key:
              type: "string"
            text:
              type: "string"
              nullable: true
          required_properties:
          - "key"
          - "text"
        expr: |-
          ${checkedMapping(`
          m.lookup(source.records,
          source.selected,
          "key")
          `,({records:checkedMapping(`
          (source).flatMap(item=>m.select(item,
          [[]],
          true))
          `,data.inputs.observationPages),selected:data.inputs.selectedKeys}))}
skill:
  description: ""
  inputs:
    observationPages:
      type: "array"
      items:
        type: "array"
        items:
          type: "object"
          properties:
            key:
              type: "string"
            text:
              type: "string"
              nullable: true
          required_properties:
          - "key"
          - "text"
      required: true
    selectedKeys:
      type: "array"
      items:
        type: "string"
      required: true
  outputs:
    products:
      type: "array"
      items:
        type: "object"
        properties:
          key:
            type: "string"
          text:
            type: "string"
            nullable: true
        required_properties:
        - "key"
        - "text"
      expr: |-
        ${checkedMapping(`
        m.lookup(source.records,
        source.selected,
        "key")
        `,({records:checkedMapping(`
        (source).flatMap(item=>m.select(item,
        [[]],
        true))
        `,data.inputs.observationPages),selected:data.inputs.selectedKeys}))}
