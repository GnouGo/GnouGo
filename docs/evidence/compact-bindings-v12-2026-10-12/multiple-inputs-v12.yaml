version: 1
name: "direct"
entrypoint: "main"
workflows:
  main:
    inputs:
      label:
        type: "string"
        required: true
      authorized:
        type: "boolean"
        required: true
      pattern:
        type: "string"
        required: true
    steps:
    - id: "n_887270d0cbc560af"
      type: "template.render"
      input: |-
        ${
        (() => {
          const label = data.inputs.label;
          const requiredCondition = data.inputs.authorized;
          return {
            template: data.inputs.pattern,
            data: {
              chosen: label
            }
          };
        })()
        }
      expression_contracts:
        '':
          label:
            origin: "first"
            schema:
              type: "string"
              minLength: 1
            order: 0
            source: "label"
            instance_path: "/value"
          requiredCondition:
            origin: "guard"
            schema:
              type: "boolean"
              enum:
              - true
            order: 1
            source: "requiredCondition"
            instance_path: "/value"
          chosen:
            origin: "assembly"
            schema:
              type: "string"
            order: 2
            source: "label"
            instance_path: "/chosen"
          chosen_2:
            origin: "export"
            schema:
              type: "string"
            order: 3
            source: "label"
            instance_path: "/chosen"
    outputs:
      text:
        type: "string"
        expr: "${data.steps.n_887270d0cbc560af.text}"
skill:
  description: ""
  inputs:
    label:
      type: "string"
      required: true
    authorized:
      type: "boolean"
      required: true
    pattern:
      type: "string"
      required: true
  outputs:
    text:
      type: "string"
      expr: "${data.steps.n_887270d0cbc560af.text}"
...
